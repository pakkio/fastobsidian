name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux web view packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Static build of the sample vault
        run: cargo run --locked -- sample-vault -o explorer.html

  # The page (index, search, notes, graph, live editor) in real browsers, against `fastobsidian --serve`.
  # WebKit is the engine of the app window on macOS and Linux, Chromium (WebView2) on Windows.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, browser: chromium }
          - { os: ubuntu-latest, browser: webkit }
          - { os: macos-latest, browser: webkit }
          - { os: windows-latest, browser: chromium }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux web view packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Build
        run: rustup update stable && rustup default stable && cargo build --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests
        working-directory: e2e
        run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ matrix.os }}-${{ matrix.browser }}
          path: e2e/playwright-report
          retention-days: 7

  # The real app window: start it on the sample vault, check it keeps running and indexes, and keep a screenshot.
  window:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux web view packages and a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb imagemagick gdb
      - name: Build
        run: rustup update stable && rustup default stable && cargo build --locked
      - name: Run the window (Linux)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: 1   # no GPU on the virtual display
          NO_AT_BRIDGE: 1                     # no accessibility bus either
        # GTK registers the app on the D-Bus session bus and waits for it, so give the virtual display a session
        run: |
          dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" bash -c '
            ./target/debug/fastobsidian sample-vault --no-cache 2> app.log & pid=$!
            sleep 15
            import -window root window-linux.png
            grep -q indexed app.log || { echo "--- stacks"; sudo gdb -p $pid -batch -ex "thread apply all bt 25" 2>/dev/null | grep -E "^Thread|^#" | head -150; }
            kill -0 $pid || { echo "the app exited"; cat app.log; exit 1; }
            kill $pid'
          cat app.log
          grep -q "indexed 6 notes" app.log
      - name: Run the window (macOS)
        if: runner.os == 'macOS'
        run: |
          ./target/debug/fastobsidian sample-vault --no-cache 2> app.log & pid=$!
          sleep 15
          screencapture -x window-macos.png || true
          kill -0 $pid || { echo "the app exited"; cat app.log; exit 1; }
          kill $pid
          cat app.log
          grep -q "indexed 6 notes" app.log
      - name: Run the window (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -PassThru -RedirectStandardError app.log .\target\debug\fastobsidian.exe -ArgumentList 'sample-vault','--no-cache'
          Start-Sleep -Seconds 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("window-windows.png")
          if ($p.HasExited) { Get-Content app.log; throw "the app exited" }
          Stop-Process -Id $p.Id
          Start-Sleep -Seconds 1
          Get-Content app.log
          if (-not (Select-String -Path app.log -Pattern 'indexed 6 notes' -Quiet)) { throw "the vault was not indexed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-${{ matrix.os }}
          path: window-*.png
          retention-days: 14
