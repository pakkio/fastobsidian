<!doctype html>
<html><head><meta charset="utf-8"><title>__TITLE__</title>
<style>
:root{--bg:#0d0f17;--fg:#e8eaf2;--dim:#8b93a7;--line:rgba(255,255,255,.12);--ok:#34d399;--err:#f87171;
  --grad:linear-gradient(90deg,#8b7cff,#4cc3ff 60%,#22d3ee);--glow:rgba(139,124,255,.3);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f6f7fc;--fg:#151933;--dim:#667089;--line:rgba(20,24,50,.12);--ok:#059669;--err:#dc2626;
  --grad:linear-gradient(90deg,#5b45f0,#2f8bf5 60%,#0891b2);--glow:rgba(91,69,240,.2);color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg) radial-gradient(45% 80% at 15% 50%,var(--glow),transparent 70%);color:var(--fg);
  font:11.5px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;cursor:default;border:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 18px 0 14px}
.art{width:92px;height:92px;flex:none;filter:drop-shadow(0 6px 16px var(--glow));animation:float 3s ease-in-out infinite}
.art .shine{animation:shine 2.4s ease-in-out infinite}
.main{flex:1;min-width:0}
.head{display:flex;align-items:baseline;gap:8px}
h1{margin:0;font-size:15px;font-weight:650;flex:1}
.pct{font-variant-numeric:tabular-nums;font-weight:600;color:var(--dim)}
.vault{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:4px;transition:width .15s}
.scan .bar i{width:30%;animation:slide 1.1s ease-in-out infinite}
.err .bar i{background:var(--err);width:100%}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:6px;align-items:baseline;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li b{width:10px;flex:none;text-align:center;font-weight:600}
li span{overflow:hidden;text-overflow:ellipsis}
li.run{color:var(--fg)} li.run b::before{content:"";display:inline-block;width:7px;height:7px;border:1.5px solid currentColor;
  border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
li.ok b{color:var(--ok)} li.ok b::before{content:"✓"}
li.skip b::before{content:"–"}
li.fail{color:var(--err)} li.fail b::before{content:"✕"}
.msg{color:var(--err);white-space:normal;word-break:break-word;margin-top:2px}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-3px)}}
@keyframes shine{0%,100%{opacity:.15}50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body id="box" class="scan">
  <!-- an obsidian crystal with a speed bolt -->
  <svg class="art" viewBox="0 0 120 120" aria-hidden="true">
    <defs>
      <linearGradient id="gL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a99bff"/><stop offset="1" stop-color="#5b45f0"/></linearGradient>
      <linearGradient id="gR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd8ff"/><stop offset="1" stop-color="#2f6bf5"/></linearGradient>
      <linearGradient id="gM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9c0ff"/><stop offset="1" stop-color="#7c6cff"/></linearGradient>
      <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7c2"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    </defs>
    <ellipse cx="60" cy="110" rx="30" ry="4" fill="#000" opacity=".18"/>
    <path d="M60 6 26 38 36 92 60 106z" fill="url(#gL)"/>
    <path d="M60 6 94 38 84 92 60 106z" fill="url(#gR)"/>
    <path d="M60 6 46 40 60 100 74 40z" fill="url(#gM)" opacity=".9"/>
    <path d="M60 6 46 40 26 38z" fill="#fff" class="shine"/>
    <path d="M60 6 74 40 94 38z" fill="#fff" opacity=".12"/>
    <path d="M46 40h28" stroke="#fff" stroke-opacity=".35" stroke-width="1"/>
    <path d="M66 30 50 62h11l-6 26 18-34H62l8-24z" fill="url(#gB)" stroke="#7c2d12" stroke-opacity=".25" stroke-width="1" stroke-linejoin="round"/>
    <path d="M8 52h12M4 62h14M10 72h10" stroke="#4cc3ff" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  </svg>
  <div class="main">
    <div class="head"><h1>FastObsidian!</h1><span class="pct" id="pct"></span></div>
    <div class="vault" title="__PATH__">__VAULT__</div>
    <div class="bar"><i id="fill"></i></div>
    <ul>
      <li id="vault-step" class="run"><b></b><span>Scanning folders…</span></li>
      <li id="theme-step"><b></b><span>Theme</span></li>
      <li id="plugins-step"><b></b><span>Plugins</span></li>
    </ul>
    <div class="msg" id="msg"></div>
  </div>
<script>
const box = document.getElementById('box');
// driven from Rust: step('vault' | 'theme' | 'plugins', text, 'run' | 'ok' | 'skip' | 'fail')
function step(id, text, state) {
  const li = document.getElementById(id + '-step');
  li.className = state; li.querySelector('span').textContent = text;
}
// indexing progress: done of total notes read
function progress(done, total) {
  const p = total ? Math.floor(done * 100 / total) : 100;
  box.classList.remove('scan');
  document.getElementById('fill').style.width = p + '%';
  document.getElementById('pct').textContent = p + '%';
  step('vault', 'Indexing ' + done.toLocaleString() + ' / ' + total.toLocaleString() + ' notes', 'run');
}
function done() {
  box.classList.remove('scan');
  document.getElementById('fill').style.width = '100%'; document.getElementById('pct').textContent = '100%';
}
function fail(m) {
  box.classList.add('err');
  document.getElementById('msg').textContent = m + ' (Esc or click to close)';
  const close = () => window.ipc.postMessage('splash:close');
  addEventListener('keydown', e => e.key === 'Escape' && close()); addEventListener('click', close);
}
window.ipc && window.ipc.postMessage('splash:ready');
</script></body></html>
