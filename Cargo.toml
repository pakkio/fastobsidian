[package]
name = "fastobsidian"
version = "1.3.1"
edition = "2021"
description = "Fast explorer and editor for an Obsidian vault, in its own window"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "fastobsidian"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
fancy-regex = "0.20.2"
regex = "1.13.2"
rfd = "0.18.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tao = "0.38.0"
wry = "0.58.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
